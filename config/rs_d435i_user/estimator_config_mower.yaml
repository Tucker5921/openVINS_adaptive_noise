%YAML:1.0

# verbosity: "INFO"
verbosity: "DEBUG"

use_fej: true
integration: "rk4"
use_stereo: true
max_cameras: 2

# Allow small factory-calibration errors to be refined online during this first test.
# calib_cam_extrinsics: true
# calib_cam_intrinsics: true
# calib_cam_timeoffset: true
calib_cam_extrinsics: false
calib_cam_intrinsics: false
calib_cam_timeoffset: false
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 11
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 1

gravity_mag: 9.81

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

# try_zupt: false
try_zupt: true
# zupt_chi2_multipler: 0
zupt_chi2_multipler: 20
zupt_max_velocity: 0.1 #OpenVINS 自己估計的三維速度大小不能超過這個值m/s
zupt_noise_multiplier: 100
# zupt_max_disparity: 0.5
zupt_max_disparity: 4.0 #用影像判斷靜止時，允許的「特徵點平均移動距離」上限，單位是 pixel（像素），超過會退出zupt計算
zupt_only_at_beginning: true

init_window_time: 1.0
# Initialize directly during the stationary start. New-firmware bags measured
# about 0.28 in OpenVINS' static-window statistic before vehicle motion.
init_imu_thresh: 12.5 #imu變化閾值
init_max_disparity: 10.0
# init_max_disparity: 10.0
init_max_features: 150

init_dyn_use: false
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 10.0

init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-12

init_dyn_bias_g: [ 0.0, 0.0, 0.0 ]
init_dyn_bias_a: [ 0.0, 0.0, 0.0 ]

record_timing_information: false
record_timing_filepath: "/tmp/d435i_traj_timing.txt"

save_total_state: false
filepath_est: "/tmp/d435i_ov_estimate.txt"
filepath_std: "/tmp/d435i_ov_estimate_std.txt"
filepath_gt: "/tmp/d435i_ov_groundtruth.txt"

use_klt: true
num_pts: 200
fast_threshold: 20
grid_x: 5
grid_y: 5
min_px_dist: 15
knn_ratio: 0.70
track_frequency: 30.0
downsample_cameras: false
num_opencv_threads: 4
histogram_method: "CLAHE"

use_aruco: false
num_aruco: 1024
downsize_aruco: true

up_msckf_sigma_px: 1
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: false

# relative_config_imu: "kalibr_imu_chain.yaml"
# relative_config_imucam: "kalibr_imucam_chain.yaml"
relative_config_imu: "d435i_kalibr_imucam_a4_01_ros1-imu.yaml"
relative_config_imucam: "d435i_kalibr_imucam_a4_01_ros1-camchain-imucam.yaml"
