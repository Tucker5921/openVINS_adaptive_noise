%YAML:1.0

# First-pass factory calibration extracted from d435i_openvins_test.
# Images are already rectified, hence zero distortion coefficients.
# T_cam_imu maps camera_imu_optical_frame coordinates into each camera optical frame.
cam0:
  T_cam_imu:
    - [1.0, 0.0, 0.0, 0.0055200001]
    - [0.0, 1.0, 0.0, -0.0051000002]
    - [0.0, 0.0, 1.0, -0.0117400000]
    - [0.0, 0.0, 0.0, 1.0]
  cam_overlaps: [1]
  camera_model: pinhole
  distortion_coeffs: [0.0, 0.0, 0.0, 0.0]
  distortion_model: radtan
  intrinsics: [422.72592163, 422.72592163, 421.38299561, 240.24284363]
  resolution: [848, 480]
  rostopic: /camera/camera/infra1/image_rect_raw
  timeshift_cam_imu: 0.0

cam1:
  T_cam_imu:
    - [1.0, 0.0, 0.0, -0.0446366938]
    - [0.0, 1.0, 0.0, -0.0051000002]
    - [0.0, 0.0, 1.0, -0.0117400000]
    - [0.0, 0.0, 0.0, 1.0]
  cam_overlaps: [0]
  camera_model: pinhole
  distortion_coeffs: [0.0, 0.0, 0.0, 0.0]
  distortion_model: radtan
  intrinsics: [422.72592163, 422.72592163, 421.38299561, 240.24284363]
  resolution: [848, 480]
  rostopic: /camera/camera/infra2/image_rect_raw
  timeshift_cam_imu: 0.0

